# zkernel: the framebuffer and the ps/2 keyboard and mouse as evdev devices.
# there is no udev, so devices are listed here instead of hotplugged

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "fb"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "screen"
    Device "fb"
EndSection

Section "InputDevice"
    Identifier "kbd"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "mouse"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen "screen"
    InputDevice "kbd" "CoreKeyboard"
    InputDevice "mouse" "CorePointer"
EndSection

# glx pulls in mesa and llvm, which take seconds to load and have no
# software renderer installed anyway
Section "Module"
    Disable "glx"
EndSection
