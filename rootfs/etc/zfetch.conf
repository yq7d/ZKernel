# zfetch settings for everyone, ~/.config/zfetch/zfetch.conf overrides them
#
# logo = builtin            (builtin is the badge, text is the lettering, none,
#                            or a file with your own art, ansi colors allowed)
# logo_color = 4            (0-7, the terminal colors)
# label_color = 4
# title_color = 6
# separator = ": "
# fields = title line os kernel uptime packages shell wm terminal cpu memory disk ip blank colors
# rename a label:   label_os = Operating system
# your own lines:   custom = Editor: nano      (add "custom" to fields)
