# zwm settings for everyone. copy any line into ~/.config/zwm/zwm.conf to
# change it just for you, then press super+shift+r to reload
#
# colors are #rrggbb

# what holds the window shortcuts down: super, alt, or super+alt
mod = super+alt

# the desktop: a color, "gradient #top #bottom", or a picture
background = gradient #121620 #0b0d11
# wallpaper = /home/zos/pictures/wall.ppm
# wallpaper_mode = fill        (fill, center or tile)
# pictures have to be binary ppm, on another machine:  convert pic.png pic.ppm

# shown in the middle of an empty workspace, empty for nothing
logo = ZOS

accent = #5fa8d3
inactive = #2a2f38
bar = #0b0d11
bar_text = #c9d1dc
title = #161a20

gap = 6
border = 2
# how much of the screen the big window gets, in percent
master = 55

clock = 24h
show_memory = yes

font = /usr/share/fonts/ter-v16n.psf
shell = /bin/sh

terminal_background = #14171c
terminal_foreground = #d0d6de
cursor = #5fa8d3
# the 16 terminal colors
color0 = #1c1f24
color1 = #e06c75
color2 = #98c379
color3 = #e5c07b
color4 = #61afef
color5 = #c678dd
color6 = #56b6c2
color7 = #c8ccd4
color8 = #5c6370
color9 = #ff7b86
color10 = #b5e48c
color11 = #ffd580
color12 = #81b5ff
color13 = #dc9cf0
color14 = #8be9e9
color15 = #ffffff

# extra shortcuts open a terminal running the command:
# bind = super+i zfetch
# bind = super+shift+t htop
bind = super+i zfetch

# terminals to open at login, instead of the one empty shell
# autostart = zfetch
