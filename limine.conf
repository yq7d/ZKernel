timeout: 5

/ZOS
    protocol: limine
    path: boot():/boot/zkernel
    cmdline: @CMDLINE@
    module_path: boot():/boot/initrd.tar

/ZOS - BIOS USB (pick this if the keyboard or mouse don't work)
    protocol: limine
    path: boot():/boot/zkernel
    cmdline: @CMDLINE@ nousb
    module_path: boot():/boot/initrd.tar

/ZOS - X11 with twm
    protocol: limine
    path: boot():/boot/zkernel
    cmdline: @CMDLINE@ x11
    module_path: boot():/boot/initrd.tar

/ZOS - text console
    protocol: limine
    path: boot():/boot/zkernel
    cmdline: @CMDLINE@ text
    module_path: boot():/boot/initrd.tar
